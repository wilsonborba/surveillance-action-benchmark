[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "surveillance-action-benchmark"
version = "0.1.0"
description = "Benchmark toolkit for fall and fight detection across legacy and pose+GNN approaches."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "numpy",
  "opencv-python",
  "pandas",
  "pydantic>=2",
  "pyyaml",
  "rich",
  "scikit-learn",
  "torch",
  "torchvision",
  "tqdm",
  "typer",
  "ultralytics",
]

[project.scripts]
sab = "src.main:run"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["src*"]
